<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Lista de Trámites de Catastro</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="" name="keywords">
  <meta content="" name="description">

  <!-- Favicon -->
  <link th:href="@{/img/favicon.ico}" rel="icon">

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icon Font Stylesheet -->
  <link th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css}" rel="stylesheet">
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css}" rel="stylesheet">

  <!-- Libraries Stylesheet -->
  <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
  <link th:href="@{/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css}" rel="stylesheet" />

  <!-- Customized Bootstrap Stylesheet -->
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

  <!-- Template Stylesheet -->
  <link th:href="@{/css/style.css}" rel="stylesheet">

</head>

<body>
<div class="container-xxl position-relative bg-white d-flex p-0">
  <!-- Incluir Sidebar -->
  <div th:replace="~{fragments :: sidebar}"></div>

  <!-- Content Start -->
  <div class="content">
    <!-- Incluir Navbar -->
    <div th:replace="~{fragments :: navbar}"></div>

    <!-- Aquí va el contenido específico de la página -->
    <div class="container mt-5">
      <h1>Verificar Estado del Trámite</h1>

      <h2>Detalles del Trámite</h2>
      <div>
        <p><strong>ID:</strong> <span th:text="${tramite.id}"></span></p>
        <p><strong>Nombre del Trámite:</strong> <span th:text="${tramite.nombre}"></span></p>
        <p><strong>Descripción:</strong> <span th:text="${tramite.descripcion}"></span></p>
        <p><strong>Estado Actual:</strong> <span th:text="${tramite.estado}"></span></p>
      </div>

      <!-- Formulario para actualizar el estado del trámite -->
      <form method="post" th:action="@{/documentos/estado/{id}(id=${tramite.id})}">
        <div class="mb-3">
          <label for="estado" class="form-label">Cambiar Estado</label>
          <select class="form-select" id="estado" name="estado" required>
            <option value="" disabled selected>Seleccione un estado</option>
            <option th:each="estado : ${estados}"
                    th:value="${estado}"
                    th:text="${estado}"></option>
          </select>
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
      </form>

      <!-- Botón para volver -->
      <form method="get" th:action="@{/documentos/aprobados}">
        <button type="submit" class="btn btn-secondary">Volver</button>
      </form>
    </div>


    <!-- Fin del contenido específico -->
  </div>
  <!-- Content End -->

  <!-- Incluir Footer -->
  <div th:replace="~{fragments :: footer}"></div>
</div>

<!-- JavaScript Libraries -->
<script th:src="@{https://code.jquery.com/jquery-3.4.1.min.js}"></script>
<script th:src="@{/lib/chart/chart.min.js}"></script>
<script th:src="@{/lib/easing/easing.min.js}"></script>
<script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>
<script th:src="@{/lib/tempusdominus/js/moment.min.js}"></script>
<script th:src="@{/lib/tempusdominus/js/moment-timezone.min.js}"></script>
<script th:src="@{/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js}"></script>

<!-- Template Javascript -->
<script th:src="@{/js/main.js}"></script>

<!-- Aquí van tus scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
