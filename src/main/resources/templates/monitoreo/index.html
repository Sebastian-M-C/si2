<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Lista de Trámites de Catastro</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link th:href="@{/img/favicon.ico}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" th:href="@{https://fonts.googleapis.com}">
    <link rel="preconnect" th:href="@{https://fonts.gstatic.com}" crossorigin>
    <link th:href="@{https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap}" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css}" rel="stylesheet">
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css}" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
    <link th:href="@{/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css}" rel="stylesheet" />

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
<div class="container-xxl position-relative bg-white d-flex p-0">
    <!-- Incluir Sidebar -->
    <div th:replace="~{fragments :: sidebar}"></div>

    <!-- Content Start -->
    <div class="content">
        <!-- Incluir Navbar -->
        <div th:replace="~{fragments :: navbar}"></div>

        <!-- Contenedor principal -->
        <div class="container my-3">
            <h1 class="text-center mb-3">Monitoreo de Trámites y Plazos</h1>

            <!-- Formulario de búsqueda -->
            <div class="row my-3">
                <form th:action="@{/monitoreo/buscar}" method="get" class="d-flex">
                    <div class="col-md-6">
                        <input type="text" name="busqueda" class="form-control" placeholder="Buscar por cliente o trámite..."
                               th:value="${busqueda}">
                    </div>
                    <div class="col-md-6 text-end">
                        <button type="submit" class="btn btn-primary">Filtrar</button>
                        <!-- Botón Listar -->
                        <a href="#" th:href="@{/monitoreo}" class="btn btn-secondary ms-2">Listar</a>
                    </div>
                </form>
            </div>

            <!-- Tabla de trámites -->
            <table class="table table-striped">
                <thead class="table-primary">
                <tr>
                    <th>Nombre Trámite</th>
                    <th>Nombre Cliente</th>
                    <th>Estado</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Final</th>
                </tr>
                </thead>
                <tbody class="table-group-divider">
                <tr th:each="tramite : ${tramites}">
                    <td th:text="${tramite.nombre}"></td>
                    <td th:text="${tramite.cliente.nombre +'   '+ tramite.cliente.apellido}"></td>
                    <td th:text="${tramite.estado}"></td>
                    <td th:text="${tramite.fechaInicio}"></td>
                    <td th:text="${tramite.fechaFin}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- Content End -->

    <!-- Incluir Footer -->
    <div th:replace="~{fragments :: footer}"></div>
</div>

<!-- JavaScript Libraries -->
<script th:src="@{https://code.jquery.com/jquery-3.4.1.min.js}"></script>
<script th:src="@{/lib/chart/chart.min.js}"></script>
<script th:src="@{/lib/easing/easing.min.js}"></script>
<script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>
<script th:src="@{/lib/tempusdominus/js/moment.min.js}"></script>
<script th:src="@{/lib/tempusdominus/js/moment-timezone.min.js}"></script>
<script th:src="@{/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js}"></script>

<!-- Template Javascript -->
<script th:src="@{/js/main.js}"></script>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
